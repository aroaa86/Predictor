name: Build Predictor Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Construir Predictor APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ==========================================================
      # 1. Obter o código do repositório
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Preparar Python
      # ==========================================================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ==========================================================
      # 3. Confirmar que é o projeto Predictor
      # ==========================================================
      - name: Verify Predictor project files
        shell: bash
        run: |
          set -eu

          echo "===== DIRETORIO DO PROJETO ====="
          pwd

          echo "===== FICHEIROS OBRIGATORIOS ====="
          for file in buildozer.spec main.py oraculoGui.py; do
            if [ ! -f "$file" ]; then
              echo "ERRO: $file não encontrado."
              exit 1
            fi
            echo "OK: $file encontrado ($(wc -c < "$file") bytes)"
          done

          echo "===== CONFIGURACAO DA APLICACAO ====="
          grep -nE '^[[:space:]]*(title|package\.name|package\.domain|source\.dir|source\.include_exts|source\.exclude_exts|source\.include_patterns|source\.exclude_patterns|source\.main|requirements|android\.archs|android\.api|android\.targetapi|android\.ndk|p4a\.branch)[[:space:]]*=' buildozer.spec || true

          echo "===== PONTO DE ENTRADA ====="
          sed -n '1,30p' main.py

          echo "===== FICHEIROS NA RAIZ ====="
          ls -la

      # ==========================================================
      # 4. Instalar dependências do sistema
      # ==========================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ccache

          echo "===== VERSOES ====="
          python --version
          java -version
          autoconf --version
          automake --version
          libtool --version

      # ==========================================================
      # 5. Configurar Java
      # ==========================================================
      - name: Configure Java 17
        shell: bash
        run: |
          set -eu
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      # ==========================================================
      # 6. Instalar Buildozer
      # ==========================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.37"
          buildozer --version
          cython --version

      # ==========================================================
      # 7. Verificar Android SDK
      # ==========================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -eu

          echo "ANDROID_HOME=${ANDROID_HOME:-não definido}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-não definido}"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERRO: Android SDK não encontrado."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)

          if [ -n "$SDKMANAGER" ]; then
            echo "SDK Manager: $SDKMANAGER"
            "$SDKMANAGER" --version
          else
            echo "Aviso: sdkmanager não encontrado nas cmdline-tools."
            echo "O Buildozer poderá gerir as ferramentas necessárias."
          fi

      # ==========================================================
      # 8. Compilar exclusivamente o projeto Predictor
      # ==========================================================
      - name: Build Predictor APK
        shell: bash
        run: |
          set -eu

          echo "===== CONFIRMAR PROJETO ====="

          grep -qE '^[[:space:]]*title[[:space:]]*=[[:space:]]*Predictor[[:space:]]*$' buildozer.spec || {
            echo "ERRO: o título não corresponde a Predictor."
            exit 1
          }

          grep -qE '^[[:space:]]*package\.name[[:space:]]*=[[:space:]]*predictor[[:space:]]*$' buildozer.spec || {
            echo "ERRO: package.name não corresponde a predictor."
            exit 1
          }

          grep -qE '^[[:space:]]*source\.include_exts[[:space:]]*=.*(^|[,[:space:]])py([,[:space:]]|$)' buildozer.spec || {
            echo "ERRO: source.include_exts deve incluir py."
            exit 1
          }

          echo "===== LIMPAR APK ANTIGO ====="
          mkdir -p bin
          rm -f bin/*.apk

          echo "===== COMPILAR APK ====="
          buildozer -v android debug

          echo "===== VERIFICAR FICHEIROS PREPARADOS ====="
          find .buildozer -type f \( -name 'main.py' -o -name 'oraculoGui.py' \) -print 2>/dev/null || true

          echo "===== VERIFICAR APK GERADO ====="
          find bin -maxdepth 1 -type f -name '*.apk' -print

          APK=$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: não foi gerado nenhum APK."
            exit 1
          fi

          echo "APK gerado: $APK"
          ls -lh "$APK"

      # ==========================================================
      # 9. Publicar o APK do Predictor
      # ==========================================================
      - name: Upload Predictor APK
        uses: actions/upload-artifact@v4
        with:
          name: Predictor-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
